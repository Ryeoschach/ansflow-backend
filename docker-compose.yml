services:
  # --- 数据库初始化 (仅运行一次) ---
  ansflow-init:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py sync_perms &&
             python manage.py init_rbac &&
             python manage.py init_notification_config &&
             python manage.py collectstatic --noinput"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    env_file:
      - .env
    volumes:
      - ansflow-static:/app/static
    depends_on:
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network

  # --- 核心后端 API ---
  ansflow-api:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - VECTOR_STORE_TYPE=pgvector
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ansflow-db,ansflow-redis}
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ansflow-media:/app/media
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- 前端服务 & Nginx 网关 ---
  ansflow-frontend:
    build:
      context: ../ansflow-frontend
      dockerfile: Dockerfile
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    ports:
      - "80:80"
    volumes:
      # 共享命名卷：确保与后端容器读写一致
      - ansflow-media:/usr/share/nginx/media:ro
      - ansflow-static:/usr/share/nginx/static:ro
    depends_on:
      - ansflow-api
    networks:
      - ansflow-common-network
    restart: always

  # --- Celery Worker ---
  ansflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    command: ["celery", "-A", "config", "worker", "-l", "info", "-P", "solo"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ANSFLOW_WORKER_NAME=default-worker
      - VECTOR_STORE_TYPE=pgvector
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ansflow-db,ansflow-redis}
    env_file:
      - .env
    volumes:
      - /tmp/ansflow_workspaces:/tmp/ansflow_workspaces
      - ./helm_charts:/tmp/helm_charts
      - ansflow-media:/app/media
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ansflow-common-network
    restart: always

  # --- Celery Beat ---
  ansflow-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- TaskPulse 监控器 (替代 Flower) ---
  ansflow-monitor:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["uv", "run", "python", "manage.py", "pulse_monitor"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
    env_file:
      - .env
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- PostgreSQL ---
  ansflow-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=ansflow
      - POSTGRES_USER=ansflow_user
      - POSTGRES_PASSWORD=ansflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansflow_user -d ansflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ansflow-common-network
    restart: always

  # --- Redis ---
  ansflow-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ansflow-common-network
    restart: always

networks:
  ansflow-common-network:
    name: ansflow-common-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ansflow-media:
    name: ansflow-media
  ansflow-static:
    name: ansflow-static
