services:
  # --- 数据库初始化 (仅运行一次) ---
  ansflow-init:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py sync_perms &&
             python manage.py init_rbac &&
             python manage.py init_notification_config"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    env_file:
      - .env
    depends_on:
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network

  # --- 核心后端 API ---
  ansflow-api:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- Celery Worker ---
  ansflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "config", "worker", "-l", "info", "-P", "solo"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ANSFLOW_WORKER_NAME=default-worker
    env_file:
      - .env
    volumes:
      - /tmp/ansflow_workspaces:/tmp/ansflow_workspaces
      - ./helm_charts:/tmp/helm_charts
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ansflow-common-network
    restart: always

  # --- Celery Beat (定时任务) ---
  ansflow-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://ansflow_user:ansflow_password@ansflow-db:5432/ansflow
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-me}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      ansflow-init:
        condition: service_completed_successfully
      ansflow-db:
        condition: service_healthy
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- Flower (Celery 监控面板) ---
  ansflow-flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    environment:
      - CELERY_BROKER_URL=redis://ansflow-redis:6379/6
      - REDIS_URL=redis://ansflow-redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      ansflow-redis:
        condition: service_healthy
    networks:
      - ansflow-common-network
    restart: always

  # --- PostgreSQL 数据库 ---
  ansflow-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=ansflow
      - POSTGRES_USER=ansflow_user
      - POSTGRES_PASSWORD=ansflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansflow_user -d ansflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ansflow-common-network
    restart: always

  # --- Redis (Broker & Cache) ---
  ansflow-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ansflow-common-network
    restart: always

networks:
  ansflow-common-network:
    name: ansflow-common-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
